crack_rust_inference:
  task: crack_rust_pipeline
  images_dir: .
  checkpoint1: /ABS/PATH/TO/YOUR_CRACK_CHECKPOINT.pth
  save_result: test_result/crack_rust_pipeline

  dinov3_arch: convnext_base
  dinov3_ckpt: pretrained_checkpoint/dinov3_convnext_base_pretrain_lvd1689m-801f2ba9.pth

  bin_thresh1: 0.5
  patch_size: 512
  patch_stride_ratio: 0.66
  infer_batch_size: 16

  output_name_mode: original
  output_prefix: ""

  rust_sat_min: 18
  rust_value_min: 35
  rust_b_ab_min: 4
  rust_min_area: 60
  rust_open_k: 3
  rust_close_k: 5
  save_rust_score: true
