# Fine-tune on honeycomb_original_2 from a flakingpaint-trained checkpoint

task_name: honeycomb_data1_512_finetune

model:
  backbone: convnext_base
  pretrained_weights: pretrained_checkpoint/dinov3_convnext_base_pretrain_lvd1689m-801f2ba9.pth

training:
  image_size: 512
  epochs: 20
  batch_size: 6
  num_workers: 4

  # Lower LR for transfer fine-tuning, then cosine decay
  learning_rate: 1.5e-4
  min_lr_ratio: 0.002
  warmup_lr_ratio: 0.1
  warmup_epochs: 2

datasets:
  train:
    - images: datasets/honeycomb_data1_512_512/train/images
      masks: datasets/honeycomb_data1_512_512/train/masks
      repeat_ratio: 1
  val:
    - images: datasets/honeycomb_data1_512_512/val/images
      masks: datasets/honeycomb_data1_512_512/val/masks
      repeat_ratio: 1

checkpoint:
  save_dir: ./checkpoints/{task_name}
  save_interval: 1
  # Placeholder: replace with your flakingpaint trained model checkpoint
  resume_from: ./output_checkpoints/honeycomb_epoch-50.pth

logging:
  log_dir: ./logs/{task_name}
  log_interval: 10
  image_log_interval: 50

distributed:
  addr: localhost
  port: "8102"
